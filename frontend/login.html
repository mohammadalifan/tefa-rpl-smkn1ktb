<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | TEFA RPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-slate-100 px-4 text-slate-800">
    <main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg shadow-slate-200/70">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white">
          <i data-lucide="graduation-cap" class="h-6 w-6"></i>
        </div>
        <h1 class="text-2xl font-bold">Masuk ke TEFA RPL</h1>
        <p class="mt-2 text-sm text-slate-500">Gunakan email dan password akun Anda.</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" placeholder="nama@sekolah.id" />
        </div>
        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" placeholder="Masukkan password" />
        </div>
        <p id="error-message" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert"></p>
        <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white transition hover:bg-indigo-700">
          <span>Masuk</span><i data-lucide="arrow-right" class="h-4 w-4"></i>
        </button>
      </form>
    </main>

    <script>
      lucide.createIcons();
      document.querySelector("#login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const errorMessage = document.querySelector("#error-message");
        const button = event.currentTarget.querySelector("button[type=submit]");
        button.disabled = true;
        errorMessage.classList.add("hidden");

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: form.get("email"), password: form.get("password") }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || "Login gagal.");
          window.location.href = "/";
        } catch (error) {
          errorMessage.textContent = error.message;
          errorMessage.classList.remove("hidden");
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
