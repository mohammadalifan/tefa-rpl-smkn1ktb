<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Guru | TEFA RPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <div class="flex min-h-screen">
      <aside class="w-64 bg-slate-900 px-5 py-6 text-white">
        <a href="/" class="mb-8 block text-xl font-bold">TEFA RPL</a>
        <nav class="space-y-2" aria-label="Menu utama">
          <p class="px-3 pb-1 text-xs font-semibold uppercase tracking-wider text-slate-400">Utama</p>
          <a href="/" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-300 hover:bg-slate-800 hover:text-white"><i data-lucide="layout-dashboard" class="h-5 w-5"></i><span>Dashboard</span></a>
        </nav>
        <nav class="mt-8 space-y-2" aria-label="Menu akademik">
          <p class="px-3 pb-1 text-xs font-semibold uppercase tracking-wider text-slate-400">Akademik</p>
          <a href="/guru.html" class="flex items-center gap-3 rounded-lg bg-slate-800 px-3 py-2.5 font-medium"><i data-lucide="users-round" class="h-5 w-5"></i><span>Data Guru</span></a>
          <a href="/siswa.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-300 hover:bg-slate-800 hover:text-white"><i data-lucide="graduation-cap" class="h-5 w-5"></i><span>Data Siswa</span></a>
          <a href="/#jurusan" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-300 hover:bg-slate-800 hover:text-white"><i data-lucide="panels-top-left" class="h-5 w-5"></i><span>Jurusan</span></a>
          <a href="/#kelas" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-300 hover:bg-slate-800 hover:text-white"><i data-lucide="school" class="h-5 w-5"></i><span>Kelas</span></a>
          <a href="/#absensi" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-300 hover:bg-slate-800 hover:text-white"><i data-lucide="calendar-check" class="h-5 w-5"></i><span>Absensi</span></a>
          <a href="/#nilai" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-300 hover:bg-slate-800 hover:text-white"><i data-lucide="clipboard-list" class="h-5 w-5"></i><span>Nilai</span></a>
        </nav>
      </aside>
      <main class="min-w-0 flex-1 p-8">
        <header class="mb-8 flex items-center justify-between">
          <div><h1 class="text-2xl font-bold">Data Guru</h1><p class="mt-2 text-slate-600">Daftar akun dan identitas guru.</p></div>
          <button id="logout-button" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium hover:bg-slate-50">Keluar</button>
        </header>
        <section class="mb-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <h2 id="form-title" class="text-lg font-semibold">Tambah Guru</h2>
          <p id="form-description" class="mt-1 text-sm text-slate-500">Buat akun login dan profil guru baru.</p>
          <form id="guru-form" class="mt-5 grid gap-4 sm:grid-cols-2">
            <div><label for="guru-name" class="mb-1.5 block text-sm font-medium">Nama lengkap</label><input id="guru-name" name="name" required maxlength="100" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" /></div>
            <div><label for="guru-nip" class="mb-1.5 block text-sm font-medium">NIP</label><input id="guru-nip" name="nip" required maxlength="30" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" /></div>
            <div><label for="guru-email" class="mb-1.5 block text-sm font-medium">Email</label><input id="guru-email" name="email" type="email" required maxlength="150" autocomplete="email" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" /></div>
            <div><label id="password-label" for="guru-password" class="mb-1.5 block text-sm font-medium">Password awal</label><input id="guru-password" name="password" type="password" required minlength="8" autocomplete="new-password" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" /><p id="password-hint" class="mt-1 hidden text-xs text-slate-500">Kosongkan jika password tidak diubah.</p></div>
            <div class="sm:col-span-2">
              <p id="form-message" class="mb-3 hidden rounded-lg px-3 py-2 text-sm" role="status"></p>
              <div class="flex gap-2"><button id="submit-guru" type="submit" class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-60"><i data-lucide="user-plus" class="h-4 w-4"></i><span>Simpan Guru</span></button><button id="cancel-edit" type="button" class="hidden rounded-lg border border-slate-300 px-4 py-2.5 font-medium hover:bg-slate-50">Batal</button></div>
            </div>
          </form>
        </section>
        <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-5 py-3">No.</th><th class="px-5 py-3">Nama</th><th class="px-5 py-3">NIP</th><th class="px-5 py-3">Email</th><th class="px-5 py-3">Status</th><th class="px-5 py-3">Aksi</th></tr></thead>
              <tbody id="guru-rows" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
          <p id="table-message" class="px-5 py-8 text-center text-sm text-slate-500">Memuat data guru...</p>
        </section>
      </main>
    </div>
    <script>
      lucide.createIcons();
      const tbody = document.querySelector("#guru-rows");
      const message = document.querySelector("#table-message");
      const form = document.querySelector("#guru-form");
      const passwordInput = document.querySelector("#guru-password");
      let editingGuru = null;

      async function loadGuru() {
        tbody.replaceChildren();
        message.classList.remove("hidden");
        message.textContent = "Memuat data guru...";
        const response = await fetch("/api/guru");
        if (response.status === 401 || response.redirected) return window.location.assign("/login");
        const result = await response.json();
        if (!response.ok) throw new Error(result.message);
        message.classList.toggle("hidden", result.data.length > 0);
        message.textContent = result.data.length ? "" : "Belum ada data guru.";
        result.data.forEach((guru, index) => {
          const row = document.createElement("tr");
          [index + 1, guru.name, guru.nip, guru.email, guru.is_active ? "Aktif" : "Nonaktif"].forEach((value) => {
            const cell = document.createElement("td");
            cell.className = "px-5 py-4";
            cell.textContent = value;
            row.append(cell);
          });
          const actions = document.createElement("td");
          actions.className = "whitespace-nowrap px-5 py-4";
          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.textContent = "Edit";
          editButton.className = "mr-3 font-medium text-indigo-600 hover:text-indigo-800";
          editButton.addEventListener("click", () => startEdit(guru));
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.textContent = "Hapus";
          deleteButton.className = "font-medium text-red-600 hover:text-red-800";
          deleteButton.addEventListener("click", () => deleteGuru(guru));
          actions.append(editButton, deleteButton);
          row.append(actions);
          tbody.append(row);
        });
      }

      function showFormMessage(text, success = false) {
        const formMessage = document.querySelector("#form-message");
        formMessage.textContent = text;
        formMessage.className = success
          ? "mb-3 rounded-lg bg-emerald-50 px-3 py-2 text-sm text-emerald-700"
          : "mb-3 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700";
      }

      function startEdit(guru) {
        editingGuru = guru;
        form.elements.name.value = guru.name;
        form.elements.nip.value = guru.nip;
        form.elements.email.value = guru.email;
        passwordInput.value = "";
        passwordInput.required = false;
        document.querySelector("#password-hint").classList.remove("hidden");
        document.querySelector("#password-label").textContent = "Password baru (opsional)";
        document.querySelector("#form-title").textContent = "Edit Data Guru";
        document.querySelector("#form-description").textContent = "Perbarui identitas atau kredensial akun guru.";
        document.querySelector("#submit-guru span").textContent = "Simpan Perubahan";
        document.querySelector("#cancel-edit").classList.remove("hidden");
        document.querySelector("#form-message").classList.add("hidden");
        form.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function cancelEdit() {
        editingGuru = null;
        form.reset();
        passwordInput.required = true;
        document.querySelector("#password-hint").classList.add("hidden");
        document.querySelector("#password-label").textContent = "Password awal";
        document.querySelector("#form-title").textContent = "Tambah Guru";
        document.querySelector("#form-description").textContent = "Buat akun login dan profil guru baru.";
        document.querySelector("#submit-guru span").textContent = "Simpan Guru";
        document.querySelector("#cancel-edit").classList.add("hidden");
        document.querySelector("#form-message").classList.add("hidden");
      }

      async function deleteGuru(guru) {
        if (!window.confirm(`Hapus data guru ${guru.name}? Akun login guru ini juga akan dihapus.`)) return;
        try {
          const response = await fetch(`/api/guru/${guru.id}`, { method: "DELETE" });
          const result = await response.json();
          if (response.status === 401) return window.location.assign("/login");
          if (!response.ok) throw new Error(result.message || "Data guru gagal dihapus.");
          if (editingGuru?.id === guru.id) cancelEdit();
          await loadGuru();
        } catch (error) {
          window.alert(error.message);
        }
      }

      loadGuru().catch((error) => { message.textContent = error.message || "Data guru gagal dimuat."; });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const submitButton = document.querySelector("#submit-guru");
        const data = Object.fromEntries(new FormData(form));
        const url = editingGuru ? `/api/guru/${editingGuru.id}` : "/api/guru";
        const method = editingGuru ? "PATCH" : "POST";
        submitButton.disabled = true;
        document.querySelector("#form-message").classList.add("hidden");

        try {
          const response = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          const result = await response.json();
          if (response.status === 401) return window.location.assign("/login");
          if (!response.ok) throw new Error(result.message || "Data guru gagal disimpan.");
          showFormMessage(result.message, true);
          if (editingGuru) cancelEdit();
          else form.reset();
          await loadGuru();
        } catch (error) {
          showFormMessage(error.message);
        } finally {
          submitButton.disabled = false;
        }
      });
      document.querySelector("#cancel-edit").addEventListener("click", cancelEdit);
      document.querySelector("#logout-button").addEventListener("click", async () => {
        await fetch("/api/auth/logout", { method: "POST" });
        window.location.assign("/login");
      });
    </script>
  </body>
</html>
